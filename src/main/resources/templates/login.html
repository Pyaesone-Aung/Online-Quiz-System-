<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Online Exam System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #E7E9EB;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
        }

        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid #E7E9EB;
            width: 100%;
            max-width: 460px;
            padding: 40px 36px;
        }

        .login-title {
            text-align: center;
            font-size: 1.85rem;
            font-weight: 600;
            color: #282A35;
            margin-bottom: 28px;
        }

        .form-label {
            font-size: 0.9rem;
            font-weight: 500;
            color: #282A35;
            margin-bottom: 6px;
        }

        .custom-input {
            background-color: #2563eb !important;
            color: #ffffff !important;
            border: none !important;
            border-radius: 30px !important;
            padding: 12px 20px !important;
            font-size: 0.95rem;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15);
            transition: all 0.2s ease-in-out;
        }

        .custom-input::placeholder {
            color: rgba(255, 255, 255, 0.85) !important;
            opacity: 1;
        }

        .custom-input:focus {
            background-color: #1d4ed8 !important;
            color: #ffffff !important;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.35), inset 0 2px 4px rgba(0, 0, 0, 0.2);
            outline: none;
        }

        .btn-custom-login {
            background-color: #04AA6D !important;
            color: #ffffff !important;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            border-radius: 30px;
            padding: 12px;
            width: 100%;
            box-shadow: 0 4px 12px rgba(4, 170, 109, 0.3);
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }

        .btn-custom-login:hover {
            background-color: #038c5a !important;
            box-shadow: 0 6px 16px rgba(4, 170, 109, 0.4);
            color: #ffffff !important;
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.88rem;
            color: #475569;
        }

        .login-footer a {
            color: #04AA6D;
            text-decoration: underline;
            font-weight: 600;
        }

        .login-footer a:hover {
            color: #038c5a;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments :: navbar}"></div>

<div class="login-wrapper">
    <div class="login-card">
        <h2 class="login-title">Login</h2>

        <div th:if="${param.error}" class="alert alert-danger rounded-4 py-2 px-3 mb-3 text-center small">
            Invalid username or password.
        </div>
        <div th:if="${param.logout}" class="alert alert-success rounded-4 py-2 px-3 mb-3 text-center small">
            You have been logged out.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">E-Mail / Username</label>
                <input type="text" class="form-control custom-input" id="username" name="username" placeholder="Enter your email or username" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control custom-input" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-custom-login">Login</button>
        </form>

        <div class="login-footer">
            <span>New student? </span><a th:href="@{/register}">Create an account</a>
        </div>
    </div>
</div>

</body>
</html>
