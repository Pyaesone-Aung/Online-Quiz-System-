<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Student Account - Online Exam System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #E7E9EB;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
        }

        .register-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .register-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid #E7E9EB;
            width: 100%;
            max-width: 780px;
            padding: 44px 52px;
        }

        .register-title {
            text-align: center;
            font-size: 1.85rem;
            font-weight: 600;
            color: #282A35;
            margin-bottom: 28px;
        }

        .form-label {
            font-size: 0.9rem;
            font-weight: 500;
            color: #282A35;
            margin-bottom: 6px;
        }

        .custom-input {
            background-color: #2563eb !important;
            color: #ffffff !important;
            border: none !important;
            border-radius: 30px !important;
            padding: 12px 20px !important;
            font-size: 0.95rem;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15);
            transition: all 0.2s ease-in-out;
        }

        .custom-input::placeholder {
            color: rgba(255, 255, 255, 0.85) !important;
            opacity: 1;
        }

        .custom-input:focus {
            background-color: #1d4ed8 !important;
            color: #ffffff !important;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.35), inset 0 2px 4px rgba(0, 0, 0, 0.2);
            outline: none;
        }

        .custom-input[type="file"]::file-selector-button {
            background-color: #1d4ed8;
            color: #ffffff;
            border: none;
            border-radius: 15px;
            padding: 4px 12px;
            margin-right: 10px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .custom-input[type="file"]::file-selector-button:hover {
            background-color: #1e40af;
        }

        .btn-custom-register {
            background-color: #04AA6D !important;
            color: #ffffff !important;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            border-radius: 30px;
            padding: 12px;
            width: 100%;
            box-shadow: 0 4px 12px rgba(4, 170, 109, 0.3);
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }

        .btn-custom-register:hover {
            background-color: #038c5a !important;
            box-shadow: 0 6px 16px rgba(4, 170, 109, 0.4);
            color: #ffffff !important;
        }

        .register-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.88rem;
            color: #475569;
        }

        .register-footer a {
            color: #04AA6D;
            text-decoration: underline;
            font-weight: 600;
        }

        .register-footer a:hover {
            color: #038c5a;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments :: navbar}"></div>

<div class="register-wrapper">
    <div class="register-card">
        <h2 class="register-title">Create Student Account</h2>

        <div th:if="${param.success}" class="alert alert-success rounded-4 py-2 px-3 mb-3 text-center small">
            Registration successful! You can now <a th:href="@{/login}" class="alert-link">login</a>.
        </div>

        <form th:action="@{/register}" th:object="${user}" method="post" enctype="multipart/form-data">
            <!-- Full Name -->
            <div class="mb-3">
                <label for="fullName" class="form-label">Full Name</label>
                <input type="text" class="form-control custom-input" id="fullName" th:field="*{fullName}" placeholder="Enter full name">
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label for="username" class="form-label">Email (this will be your login)</label>
                <input type="email" class="form-control custom-input" id="username" th:field="*{username}" placeholder="Enter email address" required>
                <p th:if="${#fields.hasErrors('username')}" class="text-danger small mt-1" th:errors="*{username}"></p>
            </div>

            <!-- Mobile Number -->
            <div class="mb-3">
                <label for="mobileNumber" class="form-label">Mobile Number</label>
                <input type="tel" class="form-control custom-input" id="mobileNumber" th:field="*{mobileNumber}" placeholder="Enter mobile number" minlength="11" maxlength="11" pattern="[0-9]{11}" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
            </div>

            <!-- Profile Picture -->
            <div class="mb-3">
                <label for="profilePicFile" class="form-label">Profile Picture</label>
                <input type="file" class="form-control custom-input" id="profilePicFile" name="profilePicFile" accept="image/png, image/jpeg">
            </div>

            <!-- Password -->
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control custom-input" id="password" th:field="*{password}" placeholder="Enter password" required>
            </div>

            <button type="submit" class="btn btn-custom-register">Register</button>
        </form>

        <div class="register-footer">
            <span>Already have an account? </span><a th:href="@{/login}">Login here</a>
        </div>
    </div>
</div>

</body>
</html>
